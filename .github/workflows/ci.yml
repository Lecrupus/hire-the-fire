name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Server tests (fail under 70% line coverage)
        run: npm run test:coverage -w server
      - name: Client tests
        run: npm test -w client
      - name: Build client
        run: npm run build -w client

  smoke:
    # Vercel and Render auto-deploy main; this checks the API came up afterwards.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.API_URL != ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy, then call /health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.API_URL }}/api/v1/health"; then exit 0; fi
            sleep 30
          done
          exit 1
